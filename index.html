<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b111a">
<title>Power Baterias × WS Baterias | Gestão</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#edf4fd;background:#0b111a}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{width:248px;background:#111c29;border-right:1px solid #253348;padding:25px 17px;position:fixed;inset:0 auto 0 0}main{margin-left:248px;padding:30px;max-width:1600px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;font-size:19px;font-weight:900}.logo{padding:10px;border-radius:12px;background:#183e2e;color:#64edaa}.brand small{display:block;font-size:10px;color:#94a5b7;font-weight:500;letter-spacing:.6px}.nav{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:10px;padding:14px 12px;text-align:left;background:transparent;color:#9eb0c3;margin:6px 0}.nav.active,.nav:hover{background:#1d3a30;color:#74f4b8}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}h1{font-size:28px;margin:0 0 8px}h2{font-size:19px;margin:0 0 18px}p{color:#9fafbf;margin:0}.tag{background:#23384a;color:#b1c9df;border-radius:100px;padding:8px 12px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.card,.panel{background:#162230;border:1px solid #263749;border-radius:16px;padding:20px}.card span{font-size:12px;color:#9cadc0}.card strong{display:block;margin-top:12px;font-size:26px;color:#69edaa}.panel{margin-bottom:20px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.btn{background:#42d999;border:0;border-radius:10px;padding:11px 16px;color:#062619;font-weight:800}.btn.secondary{background:#263a4d;color:#e4edf8}.btn.danger{background:#5a3038;color:#ffe7e7}.btn:disabled{opacity:.45;cursor:not-allowed}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;border-bottom:1px solid #2b394a;padding:14px 12px;font-size:13px}th{color:#92a8bc;font-size:12px;font-weight:600}td{color:#e3ebf3}.pill{font-size:11px;border-radius:30px;padding:6px 9px;background:#233f36;color:#71edac;white-space:nowrap}.pill.gray{background:#344154;color:#c8d1df}.pill.red{background:#4c2c36;color:#ffb1b8}.empty{text-align:center;padding:34px;color:#9eacc0}.filters{display:flex;gap:8px;flex-wrap:wrap}input,select{background:#101a26;border:1px solid #385068;border-radius:10px;color:white;padding:11px;width:100%;outline:none}input:focus,select:focus{border-color:#66e6ac}form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{font-size:12px;color:#afbece;display:grid;gap:6px}.wide{grid-column:1/-1}.modal{position:fixed;inset:0;background:#02070bd9;display:none;justify-content:center;align-items:center;padding:18px;z-index:10}.modal.open{display:flex}.dialog{background:#182534;border:1px solid #365064;border-radius:18px;max-width:780px;width:100%;max-height:90vh;overflow-y:auto;padding:22px}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialog-head h2{margin:0}.notice{background:#192c39;border:1px solid #315166;border-radius:10px;padding:12px;color:#bdcedc;font-size:12px;margin:18px 0}.toast{position:fixed;bottom:22px;right:22px;background:#234b39;color:#d8ffe9;border-radius:12px;padding:15px;display:none;z-index:20}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.small{color:#aabacc;font-size:12px}.hamb{display:none}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){aside{position:static;width:auto;padding:14px;border-right:0;border-bottom:1px solid #293a4d}.brand{margin:0 0 12px}.links{display:flex;overflow:auto;gap:3px}.nav{white-space:nowrap;padding:10px}main{margin:0;padding:18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}form{grid-template-columns:1fr 1fr}}@media(max-width:440px){.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.card strong{font-size:20px}form{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<aside><div class="brand"><span class="logo">▣</span><div>POWER <span style="color:#66eaa9">× WS</span><small>GESTÃO DE BATERIAS USADAS</small></div></div><nav class="links" id="nav"></nav><div class="notice">⚠️ DEMONSTRAÇÃO LOCAL<br>Dados armazenados apenas neste navegador. Não use dados reais nesta versão.</div></aside>
<main><header><div><h1 id="heading">Visão geral</h1><p id="subtitle">Acompanhe a operação de baterias usadas</p></div><span class="tag">● Protótipo v1.0</span></header><section id="view"></section></main>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="modalTitle"></h2><button class="btn secondary" onclick="closeModal()">Fechar ✕</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const KEY='pbws_demo_v1';
const sections=[['dashboard','▦','Visão geral'],['baterias','▤','Baterias'],['vendas','▣','Vendas'],['repasses','⇄','Repasses'],['garantias','♢','Garantias'],['historico','◷','Histórico']];
const initial={baterias:[{id:'WS-0001',marca:'Moura',modelo:'60Ah',serie:'DEMO-001',custo:65,recuperacao:20,preco:190,estado:'Disponível',observacao:'Exemplo fictício',created:new Date().toISOString()},{id:'WS-0002',marca:'Heliar',modelo:'70Ah',serie:'DEMO-002',custo:80,recuperacao:15,preco:230,estado:'Em recuperação',observacao:'Exemplo fictício',created:new Date().toISOString()}],vendas:[],repasses:[],historico:[]};
let state;try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):structuredClone(initial)}catch(e){state=JSON.parse(JSON.stringify(initial))}
let tab='dashboard';
const $=s=>document.querySelector(s);
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const date=s=>new Date(s).toLocaleDateString('pt-BR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,extra='')=>'<button class="btn '+extra+'" onclick="'+action+'">'+label+'</button>';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function log(acao,detalhe){state.historico.unshift({id:crypto.randomUUID(),acao,detalhe,at:new Date().toISOString()});save()}
function toast(msg){const el=$('#toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2700)}
function formField(label,name,type='text',value='',required=true){return '<label>'+esc(label)+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+' '+(type==='number'?'min="0" step="0.01"':'')+'></label>'}
function selectField(label,name,opts,selected){return '<label>'+label+'<select name="'+name+'">'+opts.map(o=>'<option '+(o===selected?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label>'}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}
window.closeModal=()=>$('#modal').classList.remove('open');
function rowEmpty(span=6){return '<tr><td colspan="'+span+'" class="empty">Nenhum registro encontrado.</td></tr>'}
function table(headers,rows){return '<table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+ (rows.length?rows.join(''):rowEmpty(headers.length))+'</tbody></table>'}
function card(label,value){return '<div class="card"><span>'+label+'</span><strong>'+value+'</strong></div>'}
function dashboard(){const vendidos=state.vendas.reduce((s,v)=>s+Number(v.valor),0);const lucro=state.vendas.reduce((s,v)=>s+Number(v.valor)-Number(v.custo)-Number(v.recuperacao),0);const pend=state.baterias.reduce((s,b)=>s+Number(b.custo),0)-state.repasses.reduce((s,r)=>s+Number(r.valor),0);return '<div class="cards">'+card('Faturamento registrado',money(vendidos))+card('Estoque disponível',state.baterias.filter(b=>b.estado==='Disponível').length)+card('Margem bruta registrada',money(lucro))+card('Saldo de repasses (estimado)',money(pend))+'</div><div class="two"><div class="panel"><h2>Operação resumida</h2><p>Em recuperação: '+state.baterias.filter(b=>b.estado==='Em recuperação').length+'</p><p style="margin-top:12px">Baterias vendidas: '+state.vendas.length+'</p><p style="margin-top:12px">Garantias cadastradas: '+state.vendas.filter(v=>v.garantia>0).length+'</p></div><div class="panel"><h2>Últimas movimentações</h2>'+(state.historico.slice(0,5).map(h=>'<p style="margin:12px 0">'+esc(h.acao)+' — '+esc(h.detalhe)+'</p>').join('')||'<p>Ainda não há movimentos.</p>')+'</div></div><p class="small">Valores demonstrativos. Saldo de repasses estimado considera todos os custos cadastrados como devidos à Power; a regra financeira real será definida na integração.</p>'}
function batteries(){const rows=state.baterias.map(b=>'<tr><td><strong>'+esc(b.id)+'</strong><div class="small">'+esc(b.serie)+'</div></td><td>'+esc(b.marca)+' '+esc(b.modelo)+'</td><td>'+money(b.custo)+'</td><td>'+money(b.recuperacao)+'</td><td>'+money(b.preco)+'</td><td><span class="pill '+(b.estado==='Vendida'?'gray':b.estado==='Descartada'?'red':'')+'">'+esc(b.estado)+'</span></td><td>'+btn('Editar','editBattery(\''+esc(b.id)+'\')','secondary')+'</td></tr>');return '<div class="panel"><div class="toolbar"><h2>Estoque individual</h2>'+btn('+ Nova bateria','newBattery()')+'</div>'+table(['ID / Série','Bateria','Aquisição','Recuperação','Preço','Situação',''],rows)+'</div>'}
window.newBattery=()=>batteryForm();
window.editBattery=id=>batteryForm(state.baterias.find(b=>b.id===id));
function batteryForm(b){modal(b?'Editar bateria':'Cadastrar bateria','<form id="batteryForm">'+formField('Marca','marca','text',b?.marca)+formField('Modelo / amperagem','modelo','text',b?.modelo)+formField('Número de série','serie','text',b?.serie)+formField('Preço da sucata / aquisição (R$)','custo','number',b?.custo??0)+formField('Custo da recuperação (R$)','recuperacao','number',b?.recuperacao??0)+formField('Preço de venda (R$)','preco','number',b?.preco??0)+selectField('Situação','estado',['Recebida','Em recuperação','Disponível','Reservada','Descartada'],b?.estado??'Recebida')+formField('Observação','observacao','text',b?.observacao??'',false)+'<div class="wide">'+btn('Salvar bateria','document.getElementById(\'batteryForm\').requestSubmit()')+'</div></form>');$('#batteryForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const obj={...d,custo:Number(d.custo),recuperacao:Number(d.recuperacao),preco:Number(d.preco)};if(b){Object.assign(b,obj)}else{obj.id='WS-'+String(Math.max(0,...state.baterias.map(x=>Number(x.id.replace('WS-',''))||0))+1).padStart(4,'0');obj.created=new Date().toISOString();state.baterias.push(obj)}log(b?'Bateria atualizada':'Bateria cadastrada',obj.id+' — '+obj.marca+' '+obj.modelo);closeModal();render();toast('Bateria salva')}}
function sales(){const rows=state.vendas.map(v=>'<tr><td>'+date(v.data)+'</td><td>'+esc(v.bateriaId)+'</td><td>'+esc(v.cliente)+'</td><td>'+money(v.valor)+'</td><td>'+esc(v.pagamento)+'</td><td>'+v.garantia+' dia(s)</td></tr>');return '<div class="panel"><div class="toolbar"><h2>Histórico de vendas</h2>'+btn('+ Registrar venda','newSale()')+'</div>'+table(['Data','Bateria','Cliente','Valor','Pagamento','Garantia'],rows)+'</div>'}
window.newSale=()=>{const bs=state.baterias.filter(b=>b.estado==='Disponível');if(!bs.length)return toast('Cadastre uma bateria disponível primeiro');modal('Registrar venda','<form id="saleForm">'+selectField('Bateria','bateriaId',bs.map(b=>b.id),bs[0].id)+formField('Nome do cliente (demo)','cliente')+formField('Valor recebido (R$)','valor','number',bs[0].preco)+selectField('Pagamento','pagamento',['PIX','Dinheiro','Cartão','Outro'],'PIX')+formField('Garantia em dias','garantia','number',30)+formField('Placa do veículo (opcional)','placa','text','',false)+formField('Observações','observacao','text','',false)+'<div class="wide">'+btn('Confirmar venda','document.getElementById(\'saleForm\').requestSubmit()')+'</div></form>');$('#saleForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const b=state.baterias.find(x=>x.id===d.bateriaId);if(!b||b.estado!=='Disponível')return toast('Bateria indisponível');const v={...d,id:crypto.randomUUID(),valor:Number(d.valor),garantia:Number(d.garantia),custo:b.custo,recuperacao:b.recuperacao,data:new Date().toISOString()};state.vendas.unshift(v);b.estado='Vendida';log('Venda registrada',b.id+' — '+money(v.valor));closeModal();render();toast('Venda registrada')}}
function transfers(){const rows=state.repasses.map(r=>'<tr><td>'+date(r.data)+'</td><td>'+esc(r.descricao)+'</td><td>'+money(r.valor)+'</td></tr>');return '<div class="panel"><div class="toolbar"><h2>Acertos entre empresas</h2>'+btn('+ Registrar pagamento','newTransfer()')+'</div><div class="notice">Demonstração: pagamentos registrados pela WS à Power. Ainda não há conciliação por lote nem separação de titularidade das baterias.</div>'+table(['Data','Descrição','Valor pago'],rows)+'</div>'}
window.newTransfer=()=>{modal('Registrar pagamento','<form id="transferForm">'+formField('Descrição / referência','descricao')+formField('Valor pago (R$)','valor','number',0)+'<div class="wide">'+btn('Registrar acerto','document.getElementById(\'transferForm\').requestSubmit()')+'</div></form>');$('#transferForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));if(Number(d.valor)<=0)return toast('Informe um valor positivo');state.repasses.unshift({...d,id:crypto.randomUUID(),valor:Number(d.valor),data:new Date().toISOString()});log('Pagamento entre empresas',d.descricao+' — '+money(d.valor));closeModal();render();toast('Acerto registrado')}}
function warranties(){const vs=state.vendas.filter(v=>v.garantia>0);return '<div class="panel"><h2>Garantias de baterias vendidas</h2>'+table(['Bateria','Cliente','Início','Vencimento','Estado'],vs.map(v=>{const expiry=new Date(new Date(v.data).getTime()+v.garantia*86400000);return '<tr><td>'+esc(v.bateriaId)+'</td><td>'+esc(v.cliente)+'</td><td>'+date(v.data)+'</td><td>'+date(expiry)+'</td><td><span class="pill '+(expiry<new Date()?'red':'')+'">'+(expiry<new Date()?'Vencida':'Ativa')+'</span></td></tr>'}))+'</div>'}
function history(){return '<div class="panel"><h2>Histórico de movimentações</h2>'+table(['Data','Ação','Detalhes'],state.historico.map(h=>'<tr><td>'+new Date(h.at).toLocaleString('pt-BR')+'</td><td>'+esc(h.acao)+'</td><td>'+esc(h.detalhe)+'</td></tr>'))+'</div>'}
function render(){document.querySelector('#nav').innerHTML=sections.map(s=>'<button class="nav '+(tab===s[0]?'active':'')+'" data-tab="'+s[0]+'">'+s[1]+' '+s[2]+'</button>').join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#heading').textContent=sections.find(s=>s[0]===tab)[2];$('#subtitle').textContent=tab==='dashboard'?'Acompanhe a operação de baterias usadas':'Controle individual e histórico de movimentações';$('#view').innerHTML=({dashboard,baterias:batteries,vendas:sales,repasses:transfers,garantias:warranties,historico:history})[tab]()}
render();
})();
</script>
</body>
</html>
