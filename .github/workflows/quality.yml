name: Verificar qualidade do sistema
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    name: Verificar JavaScript, autenticacao e PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe do login
        run: node --check auth.js
      - name: Conferir sintaxe das telas
        run: node --check app.js
      - name: Executar testes de estrutura
        run: node --test tests/smoke.test.mjs

  database:
    name: Verificar financeiro em PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pbws_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pbws_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: pbws_test
    steps:
      - uses: actions/checkout@v4
      - name: Preparar schema fake do Auth para testes
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres_stub.sql
      - name: Executar controle de acesso
        run: psql -v ON_ERROR_STOP=1 -f supabase/setup-auth.sql
      - name: Instalar todas as migrações com o mesmo arquivo usado pela loja
        run: psql -v ON_ERROR_STOP=1 -f supabase/INSTALAR_FINAL.sql
      - name: Testar fluxo empresarial
        run: psql -v ON_ERROR_STOP=1 -f tests/integration.sql

  browser:
    name: Navegador real no celular e no PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar controlador Chrome de teste
        run: npm install --no-save playwright-core@1.56.1
      - name: Verificar modo mobile e desktop
        run: node tests/browser-smoke.mjs
